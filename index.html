<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>正在跳转...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 20px;
  padding: 40px 30px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  color: #fff;
}
h1 {
  font-size: 22px;
  color: #333;
  margin-bottom: 12px;
}
.desc {
  font-size: 15px;
  color: #666;
  line-height: 1.6;
  margin-bottom: 24px;
}
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  text-decoration: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.tip {
  margin-top: 16px;
  font-size: 13px;
  color: #999;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🌐</div>
  <h1 id="title">正在跳转...</h1>
  <p class="desc" id="desc">请点击下方按钮，在浏览器中打开网站</p>
  <a href="#" class="btn" id="openBtn">点击打开网站</a>
  <p class="tip">如果点击后没有反应，请复制链接到手机浏览器打开</p>
</div>

<script>
const sites = {
  mcweb: { name: 'MC 官网', url: 'https://mcweb.http.mifen.tech' },
  music: { name: '音乐站', url: 'https://music.http.mifen.tech' },
  nextcloud: { name: '云盘', url: 'https://nextcloud.http.mifen.tech' },
  emby: { name: 'Emby 媒体库', url: 'https://emby.http.mifen.tech' },
  reg: { name: 'Emby 注册', url: 'https://reg.http.mifen.tech' }
};

const params = new URLSearchParams(window.location.search);
const to = params.get('to') || 'mcweb';
const site = sites[to] || sites.mcweb;

document.getElementById('title').textContent = site.name;
document.getElementById('desc').textContent = '正在跳转到 ' + site.name + '，请点击按钮在浏览器中打开';
document.getElementById('openBtn').href = site.url;

// 检测 QQ 浏览器
const ua = navigator.userAgent;
const isQQ = /QQ\/|MicroMessenger/i.test(ua);

if (!isQQ) {
  // 外部浏览器，直接跳转
  setTimeout(() => { window.location.href = site.url; }, 800);
}
// QQ 浏览器：显示按钮让用户点
</script>
</body>
</html>
