<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>正在跳转...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: background 0.3s;
}
body[data-theme="mcweb"] { background: linear-gradient(135deg, #2d5016 0%, #4a7c2f 100%); }
body[data-theme="music"] { background: linear-gradient(135deg, #74b9ff 0%, #a8d8ea 100%); }
body[data-theme="nextcloud"] { background: linear-gradient(135deg, #1e5799 0%, #2989d8 100%); }
body[data-theme="emby"] { background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%); }
body[data-theme="reg"] { background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%); }

.card {
  background: #fff;
  border-radius: 20px;
  padding: 30px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.screenshot {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 20px;
  display: block;
}
.icon {
  width: 90px;
  height: 90px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  color: #fff;
}
body[data-theme="music"] .icon { background: linear-gradient(135deg, #74b9ff, #0984e3); }
body[data-theme="nextcloud"] .icon { background: linear-gradient(135deg, #2989d8, #1e5799); }
body[data-theme="emby"] .icon { background: linear-gradient(135deg, #52b788, #2d6a4f); }
body[data-theme="reg"] .icon { background: linear-gradient(135deg, #52b788, #2d6a4f); }

h1 {
  font-size: 22px;
  color: #333;
  margin-bottom: 12px;
}
.desc {
  font-size: 15px;
  color: #666;
  line-height: 1.6;
  margin-bottom: 24px;
}
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  color: #fff;
  text-decoration: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
body[data-theme="mcweb"] .btn { background: linear-gradient(135deg, #5c9e3e, #3d6b27); }
body[data-theme="music"] .btn { background: linear-gradient(135deg, #74b9ff, #0984e3); }
body[data-theme="nextcloud"] .btn { background: linear-gradient(135deg, #2989d8, #1e5799); }
body[data-theme="emby"] .btn { background: linear-gradient(135deg, #52b788, #2d6a4f); }
body[data-theme="reg"] .btn { background: linear-gradient(135deg, #52b788, #2d6a4f); }

.tip {
  margin-top: 16px;
  font-size: 13px;
  color: #999;
  line-height: 1.5;
}
</style>
</head>
<body data-theme="mcweb">
<div class="card">
  <img class="screenshot" id="screenshot" src="mcweb.png" alt="网站截图" style="display:none">
  <div class="icon" id="icon" style="display:none">🎵</div>
  <h1 id="title">正在跳转...</h1>
  <p class="desc" id="desc">请点击下方按钮，在浏览器中打开网站</p>
  <a href="#" class="btn" id="openBtn">点击打开网站</a>
  <p class="tip">如果点击后没有反应，请复制链接到手机浏览器打开</p>
</div>

<script>
const sites = {
  mcweb: { name: 'MC 官网', url: 'https://mcweb.http.mifen.tech', type: 'img', img: 'mcweb.png', theme: 'mcweb' },
  music: { name: '音乐站', url: 'https://music.http.mifen.tech', type: 'icon', icon: '🎵', theme: 'music' },
  nextcloud: { name: '云盘', url: 'https://nextcloud.http.mifen.tech', type: 'icon', icon: '☁️', theme: 'nextcloud' },
  emby: { name: 'Emby 媒体库', url: 'https://emby.http.mifen.tech', type: 'icon', icon: '🎬', theme: 'emby' },
  reg: { name: 'Emby 注册', url: 'https://reg.http.mifen.tech', type: 'icon', icon: '🎬', theme: 'reg' }
};

const params = new URLSearchParams(window.location.search);
const to = params.get('to') || 'mcweb';
const site = sites[to] || sites.mcweb;

document.body.setAttribute('data-theme', site.theme);

if (site.type === 'img') {
  document.getElementById('screenshot').style.display = 'block';
  document.getElementById('icon').style.display = 'none';
  document.getElementById('screenshot').src = site.img;
} else {
  document.getElementById('screenshot').style.display = 'none';
  document.getElementById('icon').style.display = 'flex';
  document.getElementById('icon').textContent = site.icon;
}

document.getElementById('title').textContent = site.name;
document.getElementById('desc').textContent = '正在跳转到 ' + site.name + '，请点击按钮在浏览器中打开';
document.getElementById('openBtn').href = site.url;

// 检测 QQ 浏览器
const ua = navigator.userAgent;
const isQQ = /QQ\/|MicroMessenger/i.test(ua);

if (!isQQ) {
  // 外部浏览器，直接跳转
  setTimeout(() => { window.location.href = site.url; }, 800);
}
// QQ 浏览器：显示按钮让用户点
</script>
</body>
</html>
